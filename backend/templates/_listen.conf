  listen {{ npm_http_port }};
{% if ipv6 -%}
  listen [::]:{{ npm_http_port }};
{% else -%}
  #listen [::]:{{ npm_http_port }};
{% endif %}
{% if certificate -%}
  listen {{ npm_https_port }} ssl;
{% if ipv6 -%}
  listen [::]:{{ npm_https_port }} ssl;
{% else -%}
  #listen [::]:{{ npm_https_port }} ssl;
{% endif %}
{% endif %}
  server_name {{ domain_names | join: " " }};
{% if http2_support == 1 or http2_support == true %}
  http2 on;
{% else -%}
  http2 off;
{% endif %}